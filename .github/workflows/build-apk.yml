name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Persistent Keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "Add permanent debug keystore for seamless updates [skip ci]" || true
            git push origin main || true
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Universal Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk HoroshoVLesu.apk
          zip -j HoroshoVLesu.zip HoroshoVLesu.apk
          mkdir -p public
          cp HoroshoVLesu.apk public/HoroshoVLesu.apk
          cp HoroshoVLesu.zip public/HoroshoVLesu.zip

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoroshoVLesu-APK
          path: |
            HoroshoVLesu.apk
            HoroshoVLesu.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Horosho V Lesu (Android APK v1.5)"
          body: |
            ### 🌲 Хорошо в Лесу v1.5 (Единый APK для обоих!):
            * 📲 **[Скачать HoroshoVLesu.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu.apk)**
            * 📦 **[Скачать HoroshoVLesu.zip](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu.zip)** (в архиве, если браузер блокирует прямое скачивание APK)

            **🎮 В виджете:**
            * Крупное фото партнера на весь фон виджета с аккуратным затемнением.
            * 3 цветные игровые шкалы (HUD): Секс ❤️, Общение 💬, Быт 🏠 со значениями и значками динамики.
            * Кнопка `🔄` прямо на виджете для мгновенного переключения партнера.
          files: |
            HoroshoVLesu.apk
            HoroshoVLesu.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
