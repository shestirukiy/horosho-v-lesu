name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Persistent Keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "Add permanent debug keystore for seamless updates [skip ci]" || true
            git push origin main || true
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK for Artem (Spouse Irina Icon)
        run: |
          cp -r android/res_artem/* android/app/src/main/res/
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk HoroshoVLesu-Artem.apk
          cp HoroshoVLesu-Artem.apk HoroshoVLesu.apk

      - name: Build APK for Irina (Spouse Artem Icon)
        run: |
          cp -r android/res_irina/* android/app/src/main/res/
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk HoroshoVLesu-Irina.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoroshoVLesu-APKs
          path: |
            HoroshoVLesu-Artem.apk
            HoroshoVLesu-Irina.apk
            HoroshoVLesu.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Horosho V Lesu (Android APKs v1.5 RPG HUD)"
          body: |
            ### 🎮 Хорошо в Лесу v1.5 — Игровой RPG HUD Виджет:
            * 👩 **Для Артёма**: [HoroshoVLesu-Artem.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu-Artem.apk) (ярлык на рабочем столе с фото Ирины + виджет статуса Ирины)
            * 👨 **Для Ирины**: [HoroshoVLesu-Irina.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu-Irina.apk) (ярлык на рабочем столе с фото Артёма + виджет статуса Артёма)
            * 🌲 **Универсальный**: [HoroshoVLesu.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu.apk)

            **Новинки v1.5:**
            * 🎮 **Игровой RPG HUD виджет**: крупное фото партнера на весь фон виджета с аккуратным затемнением.
            * 📊 **3 полоски прогресса (HUD)**: у каждой сферы (Секс ❤️, Общение 💬, Быт 🏠) своя шкала, числовое значение и стрелка динамики.
            * 🔄 Переключение между партнерами кнопкой прямо в виджете.
          files: |
            HoroshoVLesu-Artem.apk
            HoroshoVLesu-Irina.apk
            HoroshoVLesu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
