name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HoroshoVLesu.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoroshoVLesu-APK
          path: HoroshoVLesu.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Horosho V Lesu (Android APK)"
          body: "Скачайте HoroshoVLesu.apk и установите на Android телефон. Приложение будет автоматически обновляться через веб-сервер!"
          files: HoroshoVLesu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
