name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK for Artem (Spouse Irina Icon)
        run: |
          cp -r android/res_artem/* android/app/src/main/res/
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk HoroshoVLesu-Artem.apk
          cp HoroshoVLesu-Artem.apk HoroshoVLesu.apk

      - name: Build APK for Irina (Spouse Artem Icon)
        run: |
          cp -r android/res_irina/* android/app/src/main/res/
          cd android
          ./gradlew assembleDebug
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk HoroshoVLesu-Irina.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HoroshoVLesu-APKs
          path: |
            HoroshoVLesu-Artem.apk
            HoroshoVLesu-Irina.apk
            HoroshoVLesu.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Horosho V Lesu (Android APKs)"
          body: |
            ### 📱 Хорошо в Лесу — Персональные APK для Android:
            * 👩 **Для Артёма**: [HoroshoVLesu-Artem.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu-Artem.apk) (ярлык на рабочем столе с фото Ирины)
            * 👨 **Для Ирины**: [HoroshoVLesu-Irina.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu-Irina.apk) (ярлык на рабочем столе с фото Артёма)
            * 🌲 **Универсальный**: [HoroshoVLesu.apk](https://github.com/shestirukiy/horosho-v-lesu/releases/download/latest/HoroshoVLesu.apk)

            *Установите прямо поверх старого приложения (нажав «Обновить»). Все последующие обновления будут прилетать автоматически по воздуху без переустановок!*
          files: |
            HoroshoVLesu-Artem.apk
            HoroshoVLesu-Irina.apk
            HoroshoVLesu.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
